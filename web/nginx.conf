server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  resolver 127.0.0.11 valid=10s;
  resolver_timeout 5s;

  # Health do site para o Caddy e o scripts/deploy-compose.sh (não consulta as APIs).
  location = /health {
    default_type application/json;
    return 200 '{"status":"ok","service":"web"}';
  }

  location /api/purchases {
    set $purchases_upstream http://purchases-api:8080;
    proxy_pass $purchases_upstream;
    proxy_set_header Host $host;
  }
  location /api/auth {
    proxy_pass http://purchases-api:8080;
    proxy_set_header Host $host;
  }
  location /api/integrations {
    proxy_pass http://purchases-api:8080;
    proxy_set_header Host $host;
  }
  location /api/farms {
    proxy_pass http://purchases-api:8080;
    proxy_set_header Host $host;
  }
  location /api/users {
    proxy_pass http://purchases-api:8080;
    proxy_set_header Host $host;
  }
  location /swagger-ui {
    proxy_pass http://purchases-api:8080;
    proxy_set_header Host $host;
  }
  location /v3/api-docs {
    proxy_pass http://purchases-api:8080;
    proxy_set_header Host $host;
  }
  location /webjars {
    proxy_pass http://purchases-api:8080;
    proxy_set_header Host $host;
  }
  location /api/analytics {
    set $analytics_upstream http://analytics-api:8081;
    proxy_pass $analytics_upstream;
    proxy_set_header Host $host;
  }
  location /q/ {
    proxy_pass http://analytics-api:8081;
    proxy_set_header Host $host;
  }
  location / {
    try_files $uri $uri/ /index.html;
  }
}
