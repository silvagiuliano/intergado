services:
  purchases-api:
    build: ./services/purchases-api
    environment:
      DB_URL: jdbc:sqlite:/data/intergado.db
      AUTH_ALLOWED_EMAILS: ${AUTH_ALLOWED_EMAILS:-}
      AUTH_CODE_MINUTES: ${AUTH_CODE_MINUTES:-10}
      AUTH_SESSION_DAYS: ${AUTH_SESSION_DAYS:-7}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      AUTH_EMAIL_FROM: ${AUTH_EMAIL_FROM:-Intergado <onboarding@resend.dev>}
      # Evolution API: só responde quando compose.evolution.yaml também está ativo
      EVOLUTION_API_URL: http://evolution-api:8080
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-}
      EVOLUTION_INSTANCE: ${EVOLUTION_INSTANCE:-intergado}
      EVOLUTION_INSTANCE_NUMBER: ${EVOLUTION_INSTANCE_NUMBER:-}
      WHATSAPP_ENABLED: ${WHATSAPP_ENABLED:-false}
      WHATSAPP_TEST_NUMBERS: ${WHATSAPP_TEST_NUMBERS:-}
      WHATSAPP_NOTIFY_STATUSES: ${WHATSAPP_NOTIFY_STATUSES:-}
    volumes:
      - sqlite_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12

  analytics-api:
    build: ./services/analytics-api
    environment:
      DB_PATH: /data/intergado.db
    volumes:
      - sqlite_data:/data
    depends_on:
      purchases-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/q/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 12

  web:
    build: ./web
    ports:
      - "${APP_LISTEN_HOST:-0.0.0.0}:${WEB_PORT:-3000}:80"
    depends_on:
      purchases-api:
        condition: service_healthy
      analytics-api:
        condition: service_healthy

  # HTTPS na frente do Nginx. Configuração em Caddyfile e nas variáveis CADDY_* do .env.
  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    ports:
      - "${CADDY_LISTEN_HOST:-0.0.0.0}:${CADDY_HTTP_PORT:-80}:${CADDY_HTTP_PORT:-80}"
      - "${CADDY_LISTEN_HOST:-0.0.0.0}:${CADDY_HTTPS_PORT:-443}:${CADDY_HTTPS_PORT:-443}"
      - "${CADDY_LISTEN_HOST:-0.0.0.0}:${CADDY_HTTPS_PORT:-443}:${CADDY_HTTPS_PORT:-443}/udp"
    environment:
      CADDY_SITE_ADDRESS: ${CADDY_SITE_ADDRESS:-localhost}
      CADDY_TLS: ${CADDY_TLS:-auto}
      CADDY_HTTP_PORT: ${CADDY_HTTP_PORT:-80}
      CADDY_HTTPS_PORT: ${CADDY_HTTPS_PORT:-443}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  sqlite_data:
  caddy_data:
  caddy_config:
