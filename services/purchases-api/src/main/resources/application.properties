spring.application.name=purchases-api
server.port=8080
spring.datasource.url=${DB_URL:jdbc:sqlite:../../data/intergado.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.connection-init-sql=PRAGMA busy_timeout=5000
spring.sql.init.mode=always
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
app.auth.allowed-emails=${AUTH_ALLOWED_EMAILS:}
app.auth.code-minutes=${AUTH_CODE_MINUTES:10}
app.auth.session-days=${AUTH_SESSION_DAYS:7}
app.auth.cookie-secure=${AUTH_COOKIE_SECURE:false}
app.resend.api-key=${RESEND_API_KEY:}
app.resend.from=${AUTH_EMAIL_FROM:Intergado <onboarding@resend.dev>}
